<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>四國行程手帖</title>
<style>
html,body{margin:0;min-height:100%;background:#102127;color:#e8eee8;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
#boot>div{max-width:520px;width:100%}
h1{font-size:22px;font-weight:650;margin:0 0 10px}
p{color:#9bb5b1;margin:0;line-height:1.8}
</style>
</head>
<body>
<div id="boot"><div><h1>四國行程手帖</h1><p id="boot-msg">正在載入行程資料…</p></div></div>
<script>
(async()=>{
  const msg=document.getElementById('boot-msg');
  try{
    const files=Array.from({length:8},(_,i)=>'v32/part-'+String(i).padStart(2,'0')+'.txt?v=38');
    const parts=await Promise.all(files.map(async(path)=>{
      const r=await fetch(path,{cache:'no-store'});
      if(!r.ok)throw new Error(path+' HTTP '+r.status);
      return r.text();
    }));
    let html=parts.join('');
    if(!/<!doctype html/i.test(html)||!/<\/html>/i.test(html))throw new Error('行程檔案不完整');
    const uiPatch=`<style id="shikoku-compact-v31">
      /* Independent disclosure frame. The map canvas inside keeps its original DOM and sizing. */
      .atlas-controls [data-zoom="fit"],
      .journey-controls [data-journey-zoom="fit"],
      .map-controls [data-map-zoom="fit"]{display:none!important}
      .shk-map-frame{width:100%;min-width:0;overflow:hidden}
      .shk-map-frame__bar{min-height:36px;padding:0 10px 0 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#102127;color:var(--muted,#a5bdb2);font-size:11px;letter-spacing:.04em}
      .shk-map-frame__title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .shk-map-frame__toggle{width:30px;height:30px;display:grid;place-items:center;flex:none;border:1px solid #557267;border-radius:50%;background:transparent;color:var(--ink,#e8eee8);font-size:19px;line-height:1;cursor:pointer}
      .shk-map-frame__toggle:hover{background:#244238;border-color:#8fb69e}
      .shk-map-frame__body{width:100%;min-width:0}
      .shk-map-frame.is-collapsed>.shk-map-frame__body{display:none!important}
      .proposal-route-toolbar .segmented{display:none!important}
      .proposal-route-toolbar small{font-size:10px;color:var(--muted,#a5bdb2)}
      @media(max-width:640px){.shk-map-frame__bar{min-height:34px;padding-inline:10px}.proposal-route-toolbar{padding-top:12px}}
    </style>`;
    const uiBehavior=`<script>
      (()=>{
        const mapSelectors=[
          '.journey-hero > #journey-map',
          '.proposal-day .proposal-geography',
          '.map-modal-canvas',
          '.atlas.sv2-atlas',
          '.place-map-shell.large'
        ];
        const labelFor=(el)=>{
          if(el.closest('.proposal-day')) return '當日路線地圖';
          if(el.id==='journey-map') return '路線地圖';
          if(el.classList.contains('map-modal-canvas')) return '地圖詳圖';
          if(el.classList.contains('atlas')) return '住宿位置地圖';
          if(el.classList.contains('place-map-shell')) return '地點地圖';
          return '路線地圖';
        };
        const addFrame=(map)=>{
          if(!map||map.closest('.shk-map-frame'))return;
          const parent=map.parentNode;
          if(!parent)return;
          const frame=document.createElement('section');
          frame.className='shk-map-frame';
          const bar=document.createElement('div');
          bar.className='shk-map-frame__bar';
          const title=document.createElement('span');
          title.className='shk-map-frame__title';
          title.textContent=labelFor(map);
          const btn=document.createElement('button');
          btn.type='button'; btn.className='shk-map-frame__toggle';
          btn.setAttribute('aria-label','收合地圖'); btn.setAttribute('aria-expanded','true'); btn.textContent='−';
          const body=document.createElement('div');
          body.className='shk-map-frame__body';
          btn.addEventListener('click',()=>{
            const closed=frame.classList.toggle('is-collapsed');
            btn.textContent=closed?'+':'−';
            btn.setAttribute('aria-expanded',String(!closed));
            btn.setAttribute('aria-label',closed?'展開地圖':'收合地圖');
          });
          parent.insertBefore(frame,map);
          bar.append(title,btn); body.append(map); frame.append(bar,body);
        };
        const toolbarSelector='.proposal-route-toolbar';
        const cleanDailyModes=(toolbar)=>{
          toolbar.querySelectorAll('.segmented').forEach(x=>x.remove());
          const small=toolbar.querySelector('small');
          if(small&&small.textContent!=='主路線、關鍵時間與必要導航')small.textContent='主路線、關鍵時間與必要導航';
        };
        const prepare=(root)=>{
          if(!root||root.nodeType!==1)return;
          if(root.matches(mapSelectors.join(',')))addFrame(root);
          root.querySelectorAll(mapSelectors.join(',')).forEach(addFrame);
          if(root.matches(toolbarSelector))cleanDailyModes(root);
          root.querySelectorAll(toolbarSelector).forEach(cleanDailyModes);
        };
        const boot=()=>{
          prepare(document.body);
          const pending=new Set();let timer=0;
          const flush=()=>{
            timer=0;const roots=[...pending];pending.clear();
            const top=roots.filter(root=>!roots.some(other=>other!==root&&other.contains(root)));
            top.forEach(prepare);
          };
          new MutationObserver(records=>{
            for(const record of records){
              const target=record.target.nodeType===1?record.target:record.target.parentElement;
              const toolbar=target?.closest?.(toolbarSelector);if(toolbar)pending.add(toolbar);
              for(const node of record.addedNodes)if(node.nodeType===1)pending.add(node);
            }
            if(pending.size&&!timer)timer=setTimeout(flush,60);
          }).observe(document.body,{childList:true,subtree:true});
        };
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
      })();
    <\/script>`;
    html=html.replace(/<\/head\s*>/i,uiPatch+'</head>');
    html=html.replace(/<\/body\s*>/i,uiBehavior+'</body>');
    const fix='<script src="./api-cloudflare-v38.js?v=38"></'+'script>';
    if(/<\/body\s*>/i.test(html))html=html.replace(/<\/body\s*>/i,fix+'</body>');
    else html+=fix;
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    msg.textContent='載入失敗：'+String(e?.message||e)+'。請重新整理頁面。';
  }
})();
</script>
</body>
</html>
