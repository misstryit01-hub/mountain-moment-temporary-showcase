<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四國秋日紀行</title><style>html,body{margin:0;background:#0b171b;color:#dfe7e3;font:14px system-ui}#l{min-height:100vh;display:grid;place-items:center}small{opacity:.6}</style><div id="l"><div>正在載入行程…<br><small>Shikoku Trip v32</small></div></div><script>(async()=>{try{const u=["v32/part-00.txt","v32/part-01.txt","v32/part-02.txt","v32/part-03.txt","v32/part-04.txt","v32/part-05.txt","v32/part-06.txt","v32/part-07.txt"];const a=await Promise.all(u.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));document.open();document.write(a.join(''));document.close()}catch(e){document.getElementById('l').innerHTML='<div>行程載入失敗，請重新整理。<br><small>'+String(e)+'</small></div>'}})()</script>
